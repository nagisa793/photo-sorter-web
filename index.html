<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fafaf8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>写真整理 / 試作版</title>
<style>
:root{color-scheme:light;--bg:#fafaf8;--surface:#fff;--ink:#202724;--muted:#7b837f;--accent:#277460;--light:#e8f3ee;--line:#e9ebe8;--danger:#bf4545;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.3;cursor:default}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{flex:none;display:flex;align-items:center;gap:5px;padding:calc(9px + env(safe-area-inset-top)) 10px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:59px}.header h1{font-size:19px;letter-spacing:-.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;margin-right:auto;font-weight:750}.h-actions{display:flex;align-items:center;gap:0;flex:none}.iconbtn{width:33px;height:35px;border:0;background:none;display:grid;place-items:center;color:var(--ink);padding:3px;border-radius:8px}.iconbtn:active{background:var(--light)}.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.selectbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:9px 4px;white-space:nowrap}.content{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.bottom{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:8px 8px calc(7px + env(safe-area-inset-bottom));background:var(--surface)}.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:550;padding:4px}.tab.active{color:var(--accent);font-weight:750}.tab svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:2px 2px 20px}.tile{aspect-ratio:1/1;position:relative;background:#e4e8e6;overflow:hidden;user-select:none;-webkit-user-select:none}.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.tile .vid{position:absolute;right:5px;bottom:5px;background:#0008;border-radius:4px;color:white;padding:2px 5px;font-size:10px}.tile.selected:after{content:"✓";position:absolute;inset:0;background:#1c7a614f;color:white;font-size:26px;display:grid;place-items:center;font-weight:700}.tile.move-from{outline:3px solid var(--accent);outline-offset:-3px}.tile.drop-target{outline:4px solid #ffd46a;outline-offset:-4px}.tile .hidden-icon{position:absolute;inset:0;display:grid;place-items:center;color:#6c746f;font-size:24px}.tile.drag-ready{touch-action:none}.status{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.status button,.textbtn{color:var(--accent);background:none;border:0;font-weight:700;font-size:12px}.empty{min-height:58%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;padding:40px 25px;text-align:center}.empty .big{font-size:46px;line-height:1}.empty h2{font-size:18px;margin:0}.empty p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.primary{background:var(--accent);color:white;border:0;border-radius:12px;padding:12px 19px;font-weight:700}.secondary{background:var(--light);color:var(--accent);border:0;border-radius:12px;padding:11px 15px;font-weight:700}.group-list{display:flex;flex-direction:column;gap:9px;padding:13px}.group-card{display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:77px}.group-cover{width:55px;height:55px;border-radius:9px;background:#dde8e1;overflow:hidden;display:grid;place-items:center;color:var(--accent);flex:none;font-size:22px}.group-cover img{width:100%;height:100%;object-fit:cover}.group-txt{flex:1;min-width:0}.group-txt strong{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group-txt small{color:var(--muted);font-size:12px}.group-handle{background:none;border:0;padding:13px 4px;color:#a4aaa5;font-size:23px;touch-action:none}.group-add{border:1px dashed #b4c9bf;color:var(--accent);background:var(--light);border-radius:12px;font-size:14px;padding:13px;font-weight:700}.toolbar{flex:none;display:flex;align-items:center;gap:6px;overflow-x:auto;background:#fff;padding:10px 8px;border-top:1px solid var(--line)}.toolbar button{border:0;border-radius:9px;background:var(--light);color:var(--accent);font-size:12px;font-weight:750;padding:10px 10px;white-space:nowrap}.toolbar .del{background:#ffeded;color:var(--danger)}.toolbar span{font-size:12px;color:var(--muted);white-space:nowrap}.overlay{position:fixed;inset:0;z-index:25;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:19px 18px calc(20px + env(safe-area-inset-bottom));max-height:83dvh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:18px}.sheet p{font-size:13px;line-height:1.5;color:var(--muted)}.sheet-row{width:100%;display:flex;align-items:center;gap:10px;padding:14px 3px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:15px;color:var(--ink)}.sheet-row strong{margin-left:auto;color:var(--accent);font-size:13px}.sheet .actions{display:flex;gap:8px;margin-top:16px}.sheet .actions button{flex:1}.sheet input{width:100%;padding:12px;border-radius:9px;border:1px solid #d4d9d5;margin-bottom:10px;font-size:16px}.sheet label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.menu{position:fixed;z-index:22;right:8px;top:calc(51px + env(safe-area-inset-top));background:white;box-shadow:0 8px 32px #14231d2b;border:1px solid var(--line);border-radius:12px;min-width:208px;padding:5px}.menu button{display:block;width:100%;padding:12px;text-align:left;font-size:13px;color:var(--ink);background:none;border:0;border-radius:8px}.menu button:active{background:var(--light)}.arrange{background:#e6f2e9;color:#256a56;font-size:12px;font-weight:650;padding:9px 12px;display:flex;align-items:center;justify-content:space-between}.trash-row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);background:white}.trash-row .preview{width:56px;height:56px;background:#e9ebe9;border-radius:7px;display:grid;place-items:center;overflow:hidden;flex:none}.trash-row img{width:100%;height:100%;object-fit:cover}.trash-row .meta{flex:1;min-width:0}.trash-row strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trash-row small{font-size:11px;color:var(--muted)}.trash-row button{border:0;background:var(--light);color:var(--accent);padding:8px;font-size:11px;border-radius:8px;font-weight:700}.trash-row .permanent{color:var(--danger);background:#fff0f0}.viewer{position:fixed;inset:0;background:#0a0d0c;z-index:30;color:white;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.viewer-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:13px}.viewer-top button,.viewer-bottom button{color:white;background:none;border:0;font-size:14px;padding:11px}.viewer-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.viewer-media img,.viewer-media video{max-width:100%;max-height:100%;object-fit:contain}.viewer-bottom{display:flex;align-items:center;justify-content:space-around;padding:8px}.viewer-bottom .del{color:#ff9d9d}.notice{position:fixed;z-index:50;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#223a31;color:white;border-radius:12px;padding:10px 15px;font-size:12px;box-shadow:0 5px 20px #0002;max-width:85%;text-align:center}.muted{color:var(--muted);font-size:12px}.lockscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 25px;gap:13px;text-align:center}.lockscreen .big{font-size:42px}.lockscreen h2{font-size:19px;margin:0}.lockscreen p{font-size:12px;line-height:1.6;color:var(--muted);max-width:280px}.lockscreen input{font-size:18px;width:180px;letter-spacing:3px;text-align:center;padding:11px;border:1px solid #d2d8d2;border-radius:12px}.search-panel{padding:12px}.search-panel input{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:13px;font-size:16px}.search-result-title{font-size:13px;color:var(--muted);font-weight:700;margin:20px 2px 7px}.drag-ghost{position:fixed;z-index:99;pointer-events:none;width:74px;height:74px;opacity:.85;border:2px solid var(--accent);border-radius:6px;background:#dce5df;box-shadow:0 6px 24px #0003;overflow:hidden}.drag-ghost img{width:100%;height:100%;object-fit:cover}.warn{padding:12px;background:#fff6e6;border-radius:10px;color:#875a15;font-size:12px;line-height:1.6}.group-actions{display:flex;justify-content:flex-end;gap:12px;padding:4px 14px 10px}.group-actions button{background:none;border:0;color:var(--accent);font-weight:650;font-size:12px}@media(min-width:650px){#app{max-width:600px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.header{padding-top:14px}.bottom{padding-bottom:10px}.menu{right:calc((100vw - 600px)/2 + 8px)}.overlay .sheet{border-radius:20px;margin-bottom:20px}.gallery{gap:3px}}@media(max-width:370px){.header{padding-left:6px;padding-right:6px;gap:2px}.header h1{font-size:17px}.iconbtn{width:29px}.iconbtn svg{width:19px}.selectbtn{font-size:11px;padding:8px 2px}}
</style></head><body>
<div id="app"><header id="header" class="header"></header><main id="content" class="content"></main><div id="toolArea"></div><nav class="bottom" id="bottom"></nav></div><div id="popups"></div><input type="file" accept="image/*,video/*" multiple id="importFiles" hidden><input type="file" accept="application/json" id="restoreFile" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uuid=()=>globalThis.crypto?.randomUUID?.()||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const icons={undo:'<path d="M9 4 4 9l5 5M4 9h9c4 0 7 3 7 7s-3 5-7 5"/>',redo:'<path d="m15 4 5 5-5 5m5-5h-9c-4 0-7 3-7 7s3 5 7 5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',sort:'<path d="M4 7h16M7 12h10M10 17h4"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',all:'<rect x="3" y="3" width="15" height="15" rx="2"/><path d="M7 21h13a1 1 0 0 0 1-1V7"/>',group:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',back:'<path d="m15 5-7 7 7 7"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
function svg(k){return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]||''}</svg>`}
const blank=()=>({version:1,photos:{},allOrder:[],hiddenOrder:[],groups:{},groupOrder:[],sort:{all:'manual',hidden:'manual',groups:{}},pinSalt:null,pinHash:null});
let state=blank(),db,history=[],future=[],urls=new Map(),ui={tab:'all',group:null,page:null,selected:false,ids:new Set(),menu:null,arrange:false,moveId:null,unlocked:false,search:false,query:'',viewerId:null,viewerList:[],dialog:null};
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('NagisaPhotoSortV1',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('assets',{keyPath:'id'});d.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txGet(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txPut(store,value,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(value,...(key===undefined?[]:[key]));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function txDelete(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function persist(){try{await txPut('settings',state,'state')}catch(e){console.error(e);toast('保存に失敗しました。空き容量を確認してね')}}
function snapshot(){return JSON.stringify(state)}
async function change(fn){history.push(snapshot());if(history.length>45)history.shift();future=[];fn();await persist();render()}
async function undo(){if(!history.length)return;future.push(snapshot());state=JSON.parse(history.pop());await persist();render();toast('一つ戻しました')}
async function redo(){if(!future.length)return;history.push(snapshot());state=JSON.parse(future.pop());await persist();render();toast('一つ進みました')}
function toast(txt){$('.notice')?.remove();const el=document.createElement('div');el.className='notice';el.textContent=txt;document.body.append(el);setTimeout(()=>el.remove(),2400)}
function photo(id){return state.photos[id]}
function available(p){return p&&!p.deletedAt}
function groupCount(g){return g.order.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).groupIds.includes(g.id)).length}
function visibleIds(){if(ui.page==='trash')return [];let ids=[];if(ui.tab==='all')ids=state.allOrder.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).showAll);else if(ui.tab==='hidden')ids=ui.unlocked?state.hiddenOrder.filter(id=>available(photo(id))&&photo(id).hidden):[];else if(ui.group&&state.groups[ui.group])ids=state.groups[ui.group].order.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).groupIds.includes(ui.group));const mode=getSort();if(mode==='new')ids.sort((a,b)=>photo(b).importAt-photo(a).importAt);if(mode==='old')ids.sort((a,b)=>photo(a).importAt-photo(b).importAt);if(mode==='filename')ids.sort((a,b)=>photo(a).name.localeCompare(photo(b).name,'ja'));if(mode==='modified')ids.sort((a,b)=>photo(b).modified-photo(a).modified);return ids}
function getSort(){if(ui.tab==='all')return state.sort.all;if(ui.tab==='hidden')return state.sort.hidden;if(ui.group)return state.sort.groups[ui.group]||'manual';return 'manual'}
function orderForView(){if(ui.tab==='all')return state.allOrder;if(ui.tab==='hidden')return state.hiddenOrder;if(ui.tab==='groups'&&ui.group)return state.groups[ui.group].order;return null}
function arrange(arr,id,target){let i=arr.indexOf(id),j=arr.indexOf(target);if(i<0||j<0||i===j)return false;arr.splice(i,1);j=arr.indexOf(target);arr.splice(j,0,id);return true}
function setTab(tab){closePopup();ui.tab=tab;ui.group=null;ui.page=null;ui.selected=false;ui.ids.clear();ui.arrange=false;ui.moveId=null;ui.search=false;ui.menu=null;ui.viewerId=null;if(tab!=='hidden')ui.unlocked=false;render()}
function header(){let title=ui.page==='trash'?'最近削除した項目':ui.search?'検索':ui.tab==='all'?'すべて':ui.tab==='hidden'?'非公開':ui.group&&state.groups[ui.group]?state.groups[ui.group].name:'グループ';let back=!!(ui.group||ui.page||ui.search);$('#header').innerHTML=`${back?`<button class="iconbtn" data-action="back" aria-label="戻る">${svg('back')}</button>`:''}<h1>${esc(title)}</h1><div class="h-actions"><button class="iconbtn" data-action="undo" ${!history.length?'disabled':''} aria-label="一つ戻る">${svg('undo')}</button><button class="iconbtn" data-action="redo" ${!future.length?'disabled':''} aria-label="一つ進む">${svg('redo')}</button><button class="iconbtn" data-action="search" aria-label="検索">${svg('search')}</button><button class="iconbtn" data-action="sort" aria-label="ソート">${svg('sort')}</button>${!ui.page&&!ui.search&&!(ui.tab==='hidden'&&!ui.unlocked)&&!(ui.tab==='groups'&&!ui.group)?`<button class="selectbtn" data-action="select">${ui.selected?'完了':'一括選択'}</button>`:''}<button class="iconbtn" data-action="more" aria-label="その他メニュー">${svg('dots')}</button></div>`}
function bottom(){let tabs=[['all','すべて','all'],['groups','グループ','group'],['hidden','非公開','lock']];$('#bottom').innerHTML=tabs.map(([t,label,ico])=>`<button class="tab ${ui.tab===t?'active':''}" data-tab="${t}" aria-label="${label}">${svg(ico)}<span>${label}</span></button>`).join('')}
function thumb(id,opts={}){const p=photo(id);if(!p)return '';let sel=ui.ids.has(id),locked=opts.locked;return `<div class="tile ${sel?'selected':''} ${ui.moveId===id?'move-from':''} ${ui.arrange?'drag-ready':''}" data-photo-id="${id}">${locked?'<span class="hidden-icon">🔒</span>':`<img loading="lazy" data-img-id="${id}" alt="${esc(p.name)}">${p.type.startsWith('video/')?'<span class="vid">▶ 動画</span>':''}`}</div>`}
async function assetUrl(id,thumbnail=true){let key=id+(thumbnail?'t':'f');if(urls.has(key))return urls.get(key);let obj=await txGet('assets',id);if(!obj)return null;let blob=thumbnail?(obj.thumb||obj.blob):obj.blob;let url=URL.createObjectURL(blob);urls.set(key,url);return url}
function loadThumbs(root=document){root.querySelectorAll('img[data-img-id]').forEach(async img=>{let id=img.dataset.imgId,url=await assetUrl(id);if(img.isConnected&&url)img.src=url})}
function closePopup(){ui.menu=null;$('#popups').innerHTML=''}
function render(){header();bottom();$('#toolArea').innerHTML='';let content=$('#content');if(ui.search)renderSearch();else if(ui.page==='trash')renderTrash();else if(ui.tab==='groups'&&!ui.group)renderGroups();else if(ui.tab==='hidden'&&!ui.unlocked)renderLock();else renderGallery();if(ui.selected&&visibleIds().length){let chosen=[...ui.ids].filter(id=>visibleIds().includes(id));$('#toolArea').innerHTML=`<div class="toolbar"><span>${chosen.length}枚選択</span><button data-action="choose-group" ${!chosen.length?'disabled':''}>グループへ</button><button data-action="toggle-show" ${!chosen.length?'disabled':''}>すべて表示切替</button><button data-action="to-hidden" ${!chosen.length?'disabled':''}>非公開へ</button>${ui.group?`<button data-action="remove-group" ${!chosen.length?'disabled':''}>グループから外す</button>`:''}<button class="del" data-action="delete" ${!chosen.length?'disabled':''}>削除</button></div>`}loadThumbs()}
function renderGallery(){let ids=visibleIds(),content=$('#content');let cnt=ids.length;let sorted=getSort();let intro=`<div class="status"><span>${cnt}件 ${sorted==='manual'?'・手動順':'・'+({new:'追加が新しい順',old:'追加が古い順',filename:'ファイル名順',modified:'ファイル更新日順'}[sorted]||'')}</span>${ui.tab==='all'?'<button data-action="import">＋ 写真を追加</button>':ui.tab==='groups'?'<button data-action="group-options">グループ設定</button>':''}</div>`;if(ui.arrange)intro+=`<div class="arrange">写真を長押しして移動（または移動元→移動先を順にタップ）<button class="textbtn" data-action="end-arrange">完了</button></div>`;if(!cnt){let h=ui.tab==='all'?'まだ写真がありません':ui.tab==='groups'?'このグループは空です':'非公開の写真はありません';content.innerHTML=intro+`<div class="empty"><div class="big">${ui.tab==='all'?'▦':ui.tab==='groups'?'▤':'🔒'}</div><h2>${h}</h2><p>${ui.tab==='all'?'iPhoneの写真を手動で取り込んで、整理を試せます。元の写真は削除しません。':'写真を一括選択して移動できます。'}</p>${ui.tab==='all'?'<button class="primary" data-action="import">写真を追加</button><button class="secondary" data-action="samples">サンプルで試す</button>':''}</div>`;return}content.innerHTML=intro+`<div class="gallery" id="gallery">${ids.map(id=>thumb(id)).join('')}</div>`}
function renderGroups(){let content=$('#content');let cards=state.groupOrder.filter(id=>state.groups[id]).map(id=>{let g=state.groups[id],first=g.order.find(pid=>available(photo(pid))&&!photo(pid).hidden&&photo(pid).groupIds.includes(id));return `<div class="group-card" data-group-id="${id}"><div class="group-cover">${first?`<img data-img-id="${first}" alt="">`:'▤'}</div><div class="group-txt"><strong>${esc(g.name)}</strong><small>${groupCount(g)}枚</small></div><button class="group-handle" data-group-handle="${id}" aria-label="長押しで並び替え">☷</button></div>`}).join('');content.innerHTML=`<div class="status"><span>${state.groupOrder.length}グループ ・ 右端を長押しして移動</span></div><div class="group-list"><button class="group-add" data-action="add-group">＋ 新しいグループ</button>${cards}</div>`}
function renderLock(){let s=!!state.pinHash;$('#content').innerHTML=`<div class="lockscreen"><div class="big">🔒</div><h2>${s?'非公開を開く':'非公開用パスワードの設定'}</h2><p>試作版の簡易認証です。画像データ自体の暗号化はしていないため、機密写真は取り込まないでください。</p><input id="pin" type="password" placeholder="${s?'パスワード':'4文字以上のパスワード'}" autocomplete="off"><button class="primary" data-action="${s?'unlock':'set-pin'}">${s?'解除する':'設定する'}</button></div>`}
function renderTrash(){let arr=Object.values(state.photos).filter(p=>p.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);$('#content').innerHTML=`<div class="status"><span>${arr.length}件 ・ 元のiPhone写真は削除されません</span><button data-action="trash-help">説明</button></div>${arr.length?arr.map(p=>`<div class="trash-row"><div class="preview">${p.hidden?'🔒':`<img data-img-id="${p.id}" alt="">`}</div><div class="meta"><strong>${p.hidden?'非公開の項目':esc(p.name)}</strong><small>${new Date(p.deletedAt).toLocaleDateString('ja-JP')} に削除</small></div><button data-restore="${p.id}">復元</button><button class="permanent" data-purge="${p.id}">完全削除</button></div>`).join(''):`<div class="empty"><div class="big">♻</div><h2>最近削除した項目はありません</h2></div>`}`}
function renderSearch(){let q=ui.query.trim().toLocaleLowerCase();let matchedGroups=state.groupOrder.filter(id=>state.groups[id]&&!ui.unlocked&&state.groups[id].name.toLocaleLowerCase().includes(q));let matched=Object.values(state.photos).filter(p=>available(p)&&(ui.tab==='hidden'&&ui.unlocked?p.hidden:!p.hidden)&&(p.name.toLocaleLowerCase().includes(q)||p.groupIds.some(id=>state.groups[id]?.name.toLocaleLowerCase().includes(q))));$('#content').innerHTML=`<div class="search-panel"><input id="searchInput" type="search" placeholder="ファイル名・グループ名を検索" value="${esc(ui.query)}" autocomplete="off">${q?`${ui.tab!=='hidden'&&matchedGroups.length?`<div class="search-result-title">グループ</div>${matchedGroups.map(id=>`<button class="sheet-row" data-open-group="${id}">▤ ${esc(state.groups[id].name)}</button>`).join('')}`:''}<div class="search-result-title">写真・動画（${matched.length}件）</div><div class="gallery">${matched.map(p=>thumb(p.id)).join('')}</div>`:'<p class="muted">グループだけに表示した写真も検索対象です。非公開は認証中のみ検索できます。</p>'}</div>`;let input=$('#searchInput');if(!ui.searchFocused){input.focus();ui.searchFocused=true}}
function menu(which){ui.menu=ui.menu===which?null:which;if(!ui.menu){closePopup();return}let content='';if(which==='more'){content=`<button data-action="import">＋ 写真・動画を追加</button><button data-action="samples">サンプル写真を追加</button><button data-action="add-group">＋ グループを作成</button><button data-action="trash">最近削除した項目</button><button data-action="export">データをバックアップ</button><button data-action="restore-backup">バックアップを復元</button><button data-action="about">試作版について</button>`}else if(which==='sort'){content=(ui.tab==='groups'&&!ui.group?`<button data-action="group-arrange">グループは右端を長押しして移動</button>`:['manual','new','old','filename','modified'].map((v,i)=>`<button data-sort="${v}">${['手動順（自由配置）','追加が新しい順','追加が古い順','ファイル名順','ファイル更新日順'][i]} ${getSort()===v?'✓':''}</button>`).join('')+(getSort()==='manual'?`<button data-action="arrange">${ui.arrange?'配置モードを終了':'手動で並び替える'}</button>`:''))}$('#popups').innerHTML=`<div class="menu">${content}</div>`}

function chooseGroup(ids){if(!ids.length)return toast('写真を選んでね');modal('グループに追加',`<p>${ids.length}件の写真を追加します。</p><label>追加先のグループ</label><select id="groupTarget" style="width:100%;padding:12px;border:1px solid #d4d9d5;border-radius:9px;font-size:16px">${state.groupOrder.map(id=>`<option value="${id}" ${id===ui.group?'selected':''}>${esc(state.groups[id].name)}</option>`).join('')}</select><label>追加後の表示方法</label><label style="font-weight:400"><input type="radio" name="groupVisible" value="show" checked> すべてにも表示する</label><label style="font-weight:400"><input type="radio" name="groupVisible" value="hide"> グループのみに表示する</label><div class="actions"><button class="secondary" data-action="close-modal">キャンセル</button><button class="primary" data-action="apply-group">追加する</button></div>`);ui.pendingIds=ids;if(!state.groupOrder.length){$('#groupTarget').outerHTML='<p>まだグループがありません。先に「＋ グループ作成」から作ってね。</p>';$('.sheet .primary').disabled=true}}
function setSort(v){if(ui.tab==='all')state.sort.all=v;else if(ui.tab==='hidden')state.sort.hidden=v;else if(ui.group)state.sort.groups[ui.group]=v;ui.arrange=false;ui.moveId=null;closePopup();persist();render()}
function selectedIds(){return [...ui.ids].filter(id=>visibleIds().includes(id))}
function moveSelectionHidden(){let ids=selectedIds();if(!ids.length)return;modal('非公開へ移動',`<p>${ids.length}件を「すべて」と通常グループから取り除いて非公開領域へ移動します。</p><div class="warn">試作版は表示用のパスワードのみで、画像データ自体は暗号化していません。機密写真は取り込まないでください。</div><div class="actions"><button class="secondary" data-action="close-modal">キャンセル</button><button class="primary" data-action="confirm-hidden">移動する</button></div>`);ui.pendingIds=ids}

async function addGroup(){modal('新しいグループ',`<label>グループ名</label><input id="newGroupName" maxlength="48" placeholder="例：旅行"><div class="actions"><button class="secondary" data-action="close-modal">キャンセル</button><button class="primary" data-action="save-group">作成する</button></div>`);$('#newGroupName').focus()}
function groupOptions(){const g=state.groups[ui.group];if(!g)return;modal('グループ設定',`<label>グループ名</label><input id="editGroupName" maxlength="48" value="${esc(g.name)}"><div class="actions"><button class="secondary" data-action="delete-group">グループ削除</button><button class="primary" data-action="save-group-name">名前を変更</button></div><p>グループだけを削除しても、写真そのものは削除されません。</p>`)}
async function hashPin(salt,pin){const bytes=new TextEncoder().encode(salt+':'+pin);let out=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(out)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function makeThumb(file){if(file.type.startsWith('video/'))return null;let url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();let scale=Math.min(1,384/Math.max(im.naturalWidth,im.naturalHeight));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let thumb=await new Promise(res=>c.toBlob(res,'image/jpeg',.78));return thumb||file}catch(e){return file}finally{URL.revokeObjectURL(url)}}
async function importFiles(files){files=Array.from(files).filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));if(!files.length)return toast('写真や動画を選択してね');toast(`${files.length}件を取り込み中…`);let infos=[];for(const f of files){let id=uuid();try{let thumb=await makeThumb(f);await txPut('assets',{id,blob:f,thumb});infos.push({id,name:f.name||'写真',type:f.type||'image/jpeg',size:f.size,modified:f.lastModified||Date.now(),importAt:Date.now()+infos.length,groupIds:[],showAll:true,hidden:false,deletedAt:null})}catch(e){console.error(e);toast('一部の写真を取り込めませんでした')}}await change(()=>{for(let p of infos){state.photos[p.id]=p;state.allOrder.unshift(p.id)}});setTab('all');toast(`${infos.length}件を追加しました`)}
function sampleBlob(i){let names=['海と空','山の風景','街の風景','夕暮れ','植物','建物','旅の記録','カフェ','森の景色','青い空','夜景','窓辺'];let colors=[['#7fafc0','#e4d8ac'],['#829c8b','#d4ddc0'],['#c9aa88','#7e8c9c'],['#dba579','#8f9ea9'],['#7b9c7d','#d5ceaf'],['#a1aeb1','#d6bdab'],['#91b1b6','#f3d8b5'],['#b58f78','#e6d9ba'],['#688579','#b9bd8d'],['#7ca7ca','#d1e1e9'],['#596976','#b09b81'],['#c8b5a1','#f0e4cf']];let a=colors[i%12];let str=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${a[0]}"/><stop offset="1" stop-color="${a[1]}"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><circle cx="${80+i%4*110}" cy="160" r="73" fill="#ffffff66"/><path d="M0 440 Q130 ${310+(i%3)*60} 260 432 T600 375 V600 H0" fill="#ffffff55"/><path d="M0 520 Q150 390 340 490 T600 435 V600 H0" fill="#213b3630"/></svg>`;return {blob:new Blob([str],{type:'image/svg+xml'}),name:names[i%12]}}
async function addSamples(){let arr=[];for(let i=0;i<12;i++){let s=sampleBlob(i),id=uuid();await txPut('assets',{id,blob:s.blob,thumb:s.blob});arr.push({id,name:s.name+'.svg',type:'image/svg+xml',size:s.blob.size,modified:Date.now()-i*864e5,importAt:Date.now()+i,groupIds:[],showAll:true,hidden:false,deletedAt:null})}await change(()=>{for(let p of arr){state.photos[p.id]=p;state.allOrder.unshift(p.id)}});setTab('all');toast('操作用サンプルを12枚追加しました')}
function openViewer(id,ids){ui.viewerId=id;ui.viewerList=ids||visibleIds();renderViewer()}
async function renderViewer(){let id=ui.viewerId;if(!id||!photo(id))return;let p=photo(id),i=ui.viewerList.indexOf(id);let popup=document.createElement('div');popup.className='viewer';popup.id='viewer';popup.innerHTML=`<div class="viewer-top"><button data-action="close-viewer">✕ 閉じる</button><span>${i+1} / ${ui.viewerList.length}</span><span>${esc(p.name.length>16?p.name.slice(0,16)+'…':p.name)}</span></div><div class="viewer-media" id="viewerMedia">読み込み中…</div><div class="viewer-bottom"><button data-action="viewer-prev" ${i<=0?'disabled':''}>‹ 前</button><button data-action="viewer-group">グループ</button><button data-action="viewer-hidden">${p.hidden?'公開に戻す':'非公開'}</button><button class="del" data-action="viewer-delete">削除</button><button data-action="viewer-next" ${i>=ui.viewerList.length-1?'disabled':''}>次 ›</button></div>`;$('#viewer')?.remove();document.body.append(popup);let blob=await assetUrl(id,false);if(!popup.isConnected)return;$('#viewerMedia').innerHTML=p.type.startsWith('video/')?`<video controls playsinline src="${blob||''}"></video>`:`<img src="${blob||''}" alt="${esc(p.name)}">`;let startX=null;$('#viewerMedia').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('#viewerMedia').addEventListener('touchend',e=>{if(startX===null)return;let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>60)viewerStep(d<0?1:-1);startX=null},{passive:true})}
function closeViewer(){ui.viewerId=null;$('#viewer')?.remove();render()}
function viewerStep(step){let i=ui.viewerList.indexOf(ui.viewerId),n=ui.viewerList[i+step];if(n)openViewer(n,ui.viewerList)}
function download(filename,blob){let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
const b64=blob=>new Promise((res,rej)=>{let f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f.readAsDataURL(blob)});
async function exportBackup(){closePopup();toast('バックアップを作成中…');try{let assets={};for(const id of Object.keys(state.photos)){let a=await txGet('assets',id);if(a)assets[id]={blob:await b64(a.blob),thumb:a.thumb?await b64(a.thumb):null}}let result={format:'NagisaPhotoSortBackupV1',exportedAt:new Date().toISOString(),state,assets};download('写真整理バックアップ-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(result)],{type:'application/json'}));toast('バックアップを保存しました')}catch(e){console.error(e);toast('書き出しできませんでした')}}
async function fromDataUrl(str){let rsp=await fetch(str);return await rsp.blob()}
async function restoreBackup(f){if(!f)return;let data;try{data=JSON.parse(await f.text());if(data.format!=='NagisaPhotoSortBackupV1'||!data.state||!data.assets)throw new Error('format')}catch(e){toast('対応するバックアップではありません');return}if(!confirm('現在の整理データをバックアップの内容で置き換えます。よろしいですか？'))return;toast('復元中…');try{for(const [id,o] of Object.entries(data.assets)){await txPut('assets',{id,blob:await fromDataUrl(o.blob),thumb:o.thumb?await fromDataUrl(o.thumb):null})}state=data.state;history=[];future=[];for(let u of urls.values())URL.revokeObjectURL(u);urls.clear();await persist();setTab('all');toast('復元しました')}catch(e){console.error(e);toast('復元に失敗しました')}}
async function purge(id){let p=photo(id);if(!p||!p.deletedAt)return;if(!confirm('この写真を試作アプリから完全に削除します。元のiPhone写真には影響しません。よろしいですか？'))return;for(let u of [id+'t',id+'f']){if(urls.has(u))URL.revokeObjectURL(urls.get(u));urls.delete(u)}await txDelete('assets',id);delete state.photos[id];state.allOrder=state.allOrder.filter(x=>x!==id);state.hiddenOrder=state.hiddenOrder.filter(x=>x!==id);Object.values(state.groups).forEach(g=>g.order=g.order.filter(x=>x!==id));history=[];future=[];await persist();render();toast('完全削除しました')}
function back(){if(ui.search){ui.search=false;ui.query='';ui.searchFocused=false}else if(ui.page){ui.page=null}else if(ui.group){ui.group=null;ui.selected=false;ui.ids.clear();ui.arrange=false}else setTab('all');render()}
async function onAction(a){switch(a){case 'back':back();break;case 'undo':await undo();break;case 'redo':await redo();break;case 'select':ui.selected=!ui.selected;ui.ids.clear();ui.arrange=false;render();break;case 'search':closePopup();ui.search=!ui.search;ui.searchFocused=false;ui.query='';render();break;case 'sort':menu('sort');break;case 'more':menu('more');break;case 'import':closePopup();$('#importFiles').click();break;case 'samples':closePopup();await addSamples();break;case 'trash':closePopup();ui.page='trash';ui.search=false;ui.selected=false;ui.ids.clear();render();break;case 'add-group':await addGroup();break;case 'group-options':groupOptions();break;case 'arrange':ui.arrange=!ui.arrange;ui.moveId=null;closePopup();render();break;case 'end-arrange':ui.arrange=false;ui.moveId=null;render();break;case 'group-arrange':closePopup();toast('グループの右端「☷」を長押しして動かしてね');break;case 'choose-group':chooseGroup(selectedIds());break;case 'apply-group':{let id=$('#groupTarget')?.value,ids=ui.pendingIds||[];if(!state.groups[id])return toast('グループを選んでね');let show=$('input[name="groupVisible"]:checked')?.value==='show';await change(()=>{const g=state.groups[id];for(let pid of ids){let p=photo(pid);if(!p)continue;if(!p.groupIds.includes(id))p.groupIds.push(id);if(!g.order.includes(pid))g.order.unshift(pid);p.showAll=show}});ui.selected=false;ui.ids.clear();closePopup();render();toast('グループへ追加しました');break}case 'toggle-show':{let ids=selectedIds();await change(()=>{for(let id of ids)photo(id).showAll=!photo(id).showAll});ui.selected=false;ui.ids.clear();render();toast('「すべて」の表示設定を変更しました');break}case 'to-hidden':moveSelectionHidden();break;case 'confirm-hidden':{let ids=ui.pendingIds||[];await change(()=>{for(let id of ids){let p=photo(id);if(!p)continue;p.hidden=true;p.showAll=false;p.groupIds=[];if(!state.hiddenOrder.includes(id))state.hiddenOrder.unshift(id)}});ui.selected=false;ui.ids.clear();closePopup();render();toast('非公開へ移動しました');break}case 'remove-group':{let ids=selectedIds(),gid=ui.group;await change(()=>{for(let id of ids){let p=photo(id);p.groupIds=p.groupIds.filter(x=>x!==gid);if(!p.showAll&&p.groupIds.length===0)p.showAll=true}state.groups[gid].order=state.groups[gid].order.filter(x=>!ids.includes(x))});ui.selected=false;ui.ids.clear();render();toast('グループから外しました');break}case 'delete':confirmDelete(selectedIds());break;case 'confirm-delete':{let ids=ui.pendingIds||[];await change(()=>ids.forEach(id=>{if(photo(id))photo(id).deletedAt=Date.now()}));ui.selected=false;ui.ids.clear();closePopup();render();toast('最近削除した項目へ移動しました');break}case 'close-modal':closePopup();break;case 'save-group':{let name=$('#newGroupName')?.value.trim();if(!name)return toast('名前を入力してね');let id=uuid();await change(()=>{state.groups[id]={id,name,order:[]};state.groupOrder.push(id)});closePopup();ui.tab='groups';ui.group=id;render();break}case 'save-group-name':{let name=$('#editGroupName')?.value.trim();if(!name)return toast('名前を入力してね');let id=ui.group;await change(()=>state.groups[id].name=name);closePopup();break}case 'delete-group':{let id=ui.group;if(!confirm('グループを削除します。写真そのものは消えません。よろしいですか？'))return;await change(()=>{let g=state.groups[id];for(let pid of g.order){let p=photo(pid);if(!p)continue;p.groupIds=p.groupIds.filter(x=>x!==id);if(!p.showAll&&p.groupIds.length===0)p.showAll=true}delete state.groups[id];state.groupOrder=state.groupOrder.filter(x=>x!==id)});ui.group=null;closePopup();render();break}case 'set-pin':{let pin=$('#pin')?.value;if(!pin||pin.length<4)return toast('4文字以上で設定してね');if(!crypto?.subtle)return toast('HTTPS上で開いてね');let salt=uuid();state.pinSalt=salt;state.pinHash=await hashPin(salt,pin);await persist();ui.unlocked=true;render();toast('パスワードを設定しました');break}case 'unlock':{let pin=$('#pin')?.value;let h=await hashPin(state.pinSalt,pin||'');if(h===state.pinHash){ui.unlocked=true;render()}else toast('パスワードが違います');break}case 'trash-help':modal('最近削除した項目',`<p>この試作アプリ内だけのゴミ箱です。標準のiPhone写真ライブラリから元画像を削除することはありません。完全削除は取り消せないので確認画面を表示します。</p><div class="actions"><button class="primary" data-action="close-modal">閉じる</button></div>`);break;case 'export':await exportBackup();break;case 'restore-backup':closePopup();$('#restoreFile').click();break;case 'about':modal('写真整理・ブラウザ試作版',`<p>操作の確認を目的とするWebアプリです。写真は端末のブラウザ保存領域にコピーされます。Apple標準「写真」への変更・自動同期は行いません。</p><div class="warn">SafariのWebサイトデータ削除や端末の空き容量不足、ホーム画面アプリ削除などでデータが失われる可能性があります。必ず元写真を残し、必要ならその他メニューからバックアップを書き出してください。非公開は表示用の簡易認証で、暗号化した金庫ではありません。</div><div class="actions"><button class="primary" data-action="close-modal">閉じる</button></div>`);break;case 'close-viewer':closeViewer();break;case 'viewer-prev':viewerStep(-1);break;case 'viewer-next':viewerStep(1);break;case 'viewer-group':{const id=ui.viewerId;closeViewer();chooseGroup([id]);break}case 'viewer-hidden':{let id=ui.viewerId,p=photo(id);if(p.hidden){await change(()=>{p.hidden=false;p.showAll=true});closeViewer();toast('「すべて」に戻しました')}else{closeViewer();ui.pendingIds=[id];modal('非公開へ移動',`<p>写真を非公開に移動します。試作版のデータ自体は暗号化されません。</p><div class="actions"><button class="secondary" data-action="close-modal">キャンセル</button><button class="primary" data-action="confirm-hidden">移動</button></div>`)}break}case 'viewer-delete':{let id=ui.viewerId;closeViewer();confirmDelete([id]);break}}}

$('#app').addEventListener('click',async e=>{let t=e.target.closest('[data-action],[data-tab],[data-photo-id],[data-group-id],[data-restore],[data-purge],[data-sort],[data-open-group]');if(!t)return;if(t.dataset.tab){setTab(t.dataset.tab);return}if(t.dataset.action){await onAction(t.dataset.action);return}if(t.dataset.sort){setSort(t.dataset.sort);return}if(t.dataset.openGroup){ui.search=false;ui.query='';ui.group=t.dataset.openGroup;ui.tab='groups';ui.searchFocused=false;render();return}if(t.dataset.restore){await change(()=>{photo(t.dataset.restore).deletedAt=null});toast('復元しました');return}if(t.dataset.purge){await purge(t.dataset.purge);return}if(t.dataset.groupId&&!e.target.closest('[data-group-handle]')){ui.group=t.dataset.groupId;ui.selected=false;ui.ids.clear();render();return}if(t.dataset.photoId){let id=t.dataset.photoId;if(ui.arrange){if(ui.justDragged){ui.justDragged=false;return}if(!ui.moveId){ui.moveId=id;render();toast('移動先の写真をタップしてね')}else if(ui.moveId===id){ui.moveId=null;render()}else{let from=ui.moveId,order=orderForView();await change(()=>arrange(order,from,id));ui.moveId=null;render()}return}if(ui.selected){if(ui.ids.has(id))ui.ids.delete(id);else ui.ids.add(id);render();return}if(ui.search){let ids=Object.values(state.photos).filter(p=>available(p)&&(ui.tab==='hidden'&&ui.unlocked?p.hidden:!p.hidden)&&(p.name.toLocaleLowerCase().includes(ui.query.toLocaleLowerCase())||p.groupIds.some(id=>state.groups[id]?.name.toLocaleLowerCase().includes(ui.query.toLocaleLowerCase())))).map(p=>p.id);openViewer(id,ids)}else openViewer(id)}});

let drag=null;function clearDrag(){if(drag?.timer)clearTimeout(drag.timer);$('.drag-ghost')?.remove();$$('.drop-target').forEach(x=>x.classList.remove('drop-target'));drag=null}
$('#content').addEventListener('pointerdown',e=>{let handle=e.target.closest('[data-group-handle]');let tile=e.target.closest('[data-photo-id]');if(handle&&ui.tab==='groups'&&!ui.group){let source=handle.closest('[data-group-id]');drag={kind:'group',id:source.dataset.groupId,source,startX:e.clientX,startY:e.clientY,pointerId:e.pointerId,active:false};handle.setPointerCapture?.(e.pointerId);drag.timer=setTimeout(()=>{if(drag){drag.active=true;source.style.opacity='.5'}},130);return}if(tile&&ui.arrange&&getSort()==='manual'){drag={kind:'photo',id:tile.dataset.photoId,source:tile,startX:e.clientX,startY:e.clientY,pointerId:e.pointerId,active:false};tile.setPointerCapture?.(e.pointerId);drag.timer=setTimeout(()=>{if(drag){drag.active=true;drag.source.style.opacity='.4'}},180)}});
$('#content').addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;if(!drag.active){if(Math.abs(e.clientY-drag.startY)+Math.abs(e.clientX-drag.startX)>17&&drag.kind==='photo'){clearDrag()}return}let node=document.elementFromPoint(e.clientX,e.clientY)?.closest(drag.kind==='photo'?'[data-photo-id]':'[data-group-id]');$$('.drop-target').forEach(n=>n.classList.remove('drop-target'));if(node&&node.dataset[drag.kind==='photo'?'photoId':'groupId']!==drag.id)node.classList.add('drop-target');if(e.clientY>innerHeight-130)$('#content').scrollTop+=11;if(e.clientY<130)$('#content').scrollTop-=11});
$('#content').addEventListener('pointerup',async e=>{if(!drag||drag.pointerId!==e.pointerId)return;let d=drag;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest(d.kind==='photo'?'[data-photo-id]':'[data-group-id]');let id=target?.dataset[d.kind==='photo'?'photoId':'groupId'];d.source.style.opacity='';let isActive=d.active;clearDrag();if(isActive&&id&&id!==d.id){ui.justDragged=true;setTimeout(()=>ui.justDragged=false,250);let arr=d.kind==='photo'?orderForView():state.groupOrder;await change(()=>arrange(arr,d.id,id));toast('並び替えました')}else if(isActive){ui.justDragged=true;setTimeout(()=>ui.justDragged=false,250)}});
