async function assetUrl(id,thumbnail=true){

    const obj=await txGet('assets',id);if(!obj)return null;

    return source?URL.createObjectURL(source):null;

let thumbEpoch=0,thumbQueue=[],thumbActive=0,thumbObserver=null;
const THUMB_CONCURRENCY=5;
function releaseThumb(img){
  if(!img)return;
  const url=img.dataset.thumbUrl;
  if(url){try{URL.revokeObjectURL(url)}catch(_){} delete img.dataset.thumbUrl}
  img.removeAttribute('src');
  delete img.dataset.thumbLoaded;
  delete img.dataset.thumbLoading;
  delete img.dataset.thumbWanted;
}

function thumbPriority(img){
  const content=$('#content');if(!content||!img?.isConnected)return 1e9;
  const a=img.getBoundingClientRect(),b=content.getBoundingClientRect();
  return Math.abs((a.top+a.bottom)/2-(b.top+b.bottom)/2);

function queueThumb(img,epoch){
  if(!img?.isConnected||img.dataset.thumbLoaded||img.dataset.thumbLoading)return;
  img.dataset.thumbWanted='1';
  img.dataset.thumbLoading='1';
  thumbQueue.push({img,id:img.dataset.imgId,epoch,priority:thumbPriority(img)});

}
async function loadOneThumb(job){
  const {img,id,epoch}=job;let url=null;
  try{
    if(epoch!==thumbEpoch||!img.isConnected||img.dataset.thumbWanted!=='1')return;
    url=await assetUrl(id,true);
    if(!url||epoch!==thumbEpoch||!img.isConnected||img.dataset.thumbWanted!=='1')return;
    img.src=url;
    img.dataset.thumbUrl=url;
    try{await img.decode()}catch(_){}
    if(img.isConnected&&img.dataset.imgId===id&&img.dataset.thumbWanted==='1'){
      img.dataset.thumbLoaded='1';
      url=null;
    }
  }catch(e){
    console.warn('サムネイル読み込み失敗',e);
    const tries=Number(img?.dataset?.thumbRetries||0)+1;
    if(img?.dataset)img.dataset.thumbRetries=String(tries);
    if(tries<=2&&epoch===thumbEpoch&&img?.isConnected&&img.dataset.thumbWanted==='1'){
      setTimeout(()=>{if(img.isConnected&&img.dataset.thumbWanted==='1'&&!img.dataset.thumbLoaded)queueThumb(img,epoch)},180*tries);

function pumpThumbs(){

      if(job.img?.dataset)delete job.img.dataset.thumbLoading;
      continue;
    }
    thumbActive++;
    loadOneThumb(job).finally(()=>{thumbActive--;requestAnimationFrame(pumpThumbs)});
  }
}
function loadThumbs(root=document){
  thumbEpoch++;
  const epoch=thumbEpoch;
  thumbQueue.forEach(job=>{if(job.img?.dataset)delete job.img.dataset.thumbLoading});
  thumbQueue=[];
  thumbObserver?.disconnect();
  const content=$('#content');

  if('IntersectionObserver' in window&&content){
    thumbObserver=new IntersectionObserver(entries=>{
      for(const entry of entries){
        const img=entry.target;
        if(entry.isIntersecting){
          img.dataset.thumbWanted='1';
          queueThumb(img,epoch);
        }else{
          delete img.dataset.thumbWanted;
          const r=img.getBoundingClientRect(),c=content.getBoundingClientRect();

function onceEvent(el,name,timeout=8000){
  return new Promise((resolve,reject)=>{
    let timer=setTimeout(()=>{cleanup();reject(new Error(name+' timeout'))},timeout);
    const ok=()=>{cleanup();resolve()},bad=()=>{cleanup();reject(el.error||new Error(name+' error'))};
    function cleanup(){clearTimeout(timer);el.removeEventListener(name,ok);el.removeEventListener('error',bad)}
    el.addEventListener(name,ok,{once:true});el.addEventListener('error',bad,{once:true});
  });
}

function sweepIndexAt(x,y){

function photoTargetAt(x,y){return document.elementsFromPoint(x,y).map(el=>el.closest?.('#gallery .tile[data-photo-id]')).find(t=>t&&drag&&t!==drag.source)||null}

function autoScrollPhotoDrag(){if(!drag||drag.kind!=='photo'||!drag.active)return;const c=$('#content'),r=c?.getBoundingClientRect();if(c&&r){const zone=Math.min(92,r.height*.18);let speed=0;if(drag.y<r.top+zone){const q=Math.max(0,Math.min(1,(r.top+zone-drag.y)/zone));speed=-(1.1+5.4*q*q)}else if(drag.y>r.bottom-zone){const q=Math.max(0,Math.min(1,(drag.y-(r.bottom-zone))/zone));speed=1.1+5.4*q*q}if(speed){const before=c.scrollTop;c.scrollTop+=speed;if(c.scrollTop!==before)updatePhotoDrag(drag.x,drag.y,false)}}drag.autoFrame=requestAnimationFrame(autoScrollPhotoDrag)}
async function finishPhotoDrag(commit=true){if(!drag||drag.kind!=='photo')return;const d=drag,c=$('#content'),top=c.scrollTop,gallery=d.source.parentElement,newView=[...gallery.querySelectorAll('.tile[data-photo-id]')].map(n=>n.dataset.photoId),changed=newView.join('\0')!==d.beforeView.join('\0');d.source.classList.remove('photo-dragging');if(d.autoFrame)cancelAnimationFrame(d.autoFrame);clearDrag();ui.justDragged=true;setTimeout(()=>ui.justDragged=false,300);if(commit&&changed){await changeWithoutRender(()=>{state.sort.all='manual';state.manualViewAll=newView});c.scrollTop=top;toast('並び替えました')}}
let drag=null,groupHold=null,photoHold=null;function clearPhotoHold(){if(photoHold?.timer)clearTimeout(photoHold.timer);photoHold=null}function clearGroupHold(){if(groupHold?.timer)clearTimeout(groupHold.timer);groupHold=null}function clearDrag(){if(drag?.timer)clearTimeout(drag.timer);if(drag?.autoFrame)cancelAnimationFrame(drag.autoFrame);$('.drag-ghost')?.remove();$('.photo-drag-ghost')?.remove();$('.group-drag-ghost')?.remove();$$('.drop-target').forEach(x=>x.classList.remove('drop-target'));drag=null}
$('#content').addEventListener('pointerdown',e=>{
  if(ui.selected&&e.isPrimary!==false){const tile=e.target.closest('#gallery [data-photo-id]');if(tile){const order=visibleIds(),anchor=order.indexOf(tile.dataset.photoId);if(anchor>=0){selectSweep={id:e.pointerId,order,anchor,lastIndex:anchor,add:!ui.ids.has(tile.dataset.photoId),before:new Set(ui.ids),x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,active:false,frame:0,source:tile};return}}}
  let card=e.target.closest('.group-card[data-group-id]'),tile=e.target.closest('[data-photo-id]');
  if(e.pointerType!=='touch'&&card&&ui.tab==='groups'&&!ui.group&&!e.target.closest('[data-group-menu]')){card.setPointerCapture?.(e.pointerId);groupHold={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,source:card,timer:setTimeout(()=>{if(!groupHold)return;const h=groupHold;clearGroupHold();beginGroupDrag(h.source,h.startX,h.startY,h.pointerId)},300)};return}
  if(e.pointerType!=='touch'&&tile&&ui.tab==='all'&&!ui.group&&!ui.search&&!ui.selected&&!ui.arrange){const startOrder=visibleIds();tile.setPointerCapture?.(e.pointerId);photoHold={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,source:tile,startOrder,timer:setTimeout(()=>{if(!photoHold)return;const h=photoHold;clearPhotoHold();activateAllArrange(h.startOrder);beginPhotoDrag(h.source,h.startX,h.startY,h.pointerId)},320)};return}
  if(e.pointerType!=='touch'&&tile&&ui.arrange&&getSort()==='manual'){tile.setPointerCapture?.(e.pointerId);photoHold={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,source:tile,startOrder:visibleIds(),timer:setTimeout(()=>{if(!photoHold)return;const h=photoHold;clearPhotoHold();if(!Array.isArray(state.manualViewAll)){state.manualViewAll=[...h.startOrder];persist()}beginPhotoDrag(h.source,h.startX,h.startY,h.pointerId)},220)};return}
});
$('#content').addEventListener('pointermove',e=>{
  if(photoHold&&photoHold.pointerId===e.pointerId){if(Math.abs(e.clientX-photoHold.startX)+Math.abs(e.clientY-photoHold.startY)>12)clearPhotoHold();return}
  if(groupHold&&groupHold.pointerId===e.pointerId){if(Math.abs(e.clientX-groupHold.startX)+Math.abs(e.clientY-groupHold.startY)>12)clearGroupHold();return}
  if(selectSweep&&selectSweep.id===e.pointerId){const g=selectSweep;g.x=e.clientX;g.y=e.clientY;const dx=g.x-g.startX,dy=g.y-g.startY,ax=Math.abs(dx),ay=Math.abs(dy);if(!g.active){if(ay>9&&ay>ax*1.15){stopSweep(true);return}if(ax>8&&ax>=ay*.8){g.active=true;g.source?.setPointerCapture?.(e.pointerId);g.frame=requestAnimationFrame(autoScrollSweep)}else return}e.preventDefault();applySweepAt(g.x,g.y);return}
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(drag.kind==='photo'){e.preventDefault();updatePhotoDrag(e.clientX,e.clientY);return}
  if(!drag.active)return;
  if(drag.kind==='group'){e.preventDefault();updateGroupDrag(e.clientX,e.clientY)}
});
$('#content').addEventListener('pointerup',async e=>{
  if(photoHold&&photoHold.pointerId===e.pointerId){clearPhotoHold();return}
  if(groupHold&&groupHold.pointerId===e.pointerId){clearGroupHold();return}
  if(selectSweep&&selectSweep.id===e.pointerId){stopSweep();return}
  if(drag&&drag.kind==='photo'&&drag.pointerId===e.pointerId){await finishPhotoDrag(true);return}
  if(!drag||drag.pointerId!==e.pointerId)return;
  let d=drag;d.source.style.opacity='';d.source.classList.remove('group-dragging');
  if(d.kind==='group'){await finishGroupDrag(true);return}
  clearDrag();
});
$('#content').addEventListener('pointercancel',()=>{clearPhotoHold();clearGroupHold();stopSweep(true);if(drag?.kind==='photo'){finishPhotoDrag(false);return}if(drag?.kind==='group'){finishGroupDrag(false);return}if(drag?.source){drag.source.style.opacity='';drag.source.classList.remove('group-dragging')}clearDrag()});
let photoTouch=null;
function clearPhotoTouch(){if(photoTouch?.timer)clearTimeout(photoTouch.timer);photoTouch=null}
function touchById(list,id){return [...list].find(t=>t.identifier===id)}
$('#content').addEventListener('touchstart',e=>{if(e.touches.length!==1||ui.selected||ui.search)return;const tile=e.target.closest('#gallery .tile[data-photo-id]');if(!tile||ui.tab!=='all'||ui.group)return;const t=e.touches[0],startOrder=visibleIds();photoTouch={id:t.identifier,source:tile,startX:t.clientX,startY:t.clientY,startOrder,active:false,timer:setTimeout(()=>{if(!photoTouch)return;const h=photoTouch;if(!ui.arrange)activateAllArrange(h.startOrder);else if(!Array.isArray(state.manualViewAll)){state.sort.all='manual';state.manualViewAll=[...h.startOrder];persist()}h.active=beginPhotoDrag(h.source,h.startX,h.startY,null)},ui.arrange?220:320)}},{passive:true});
$('#content').addEventListener('touchmove',e=>{if(!photoTouch)return;const t=touchById(e.touches,photoTouch.id);if(!t)return;if(!photoTouch.active){if(Math.abs(t.clientX-photoTouch.startX)+Math.abs(t.clientY-photoTouch.startY)>11)clearPhotoTouch();return}e.preventDefault();updatePhotoDrag(t.clientX,t.clientY)},{passive:false});
$('#content').addEventListener('touchend',async e=>{if(!photoTouch)return;const ended=touchById(e.changedTouches,photoTouch.id);if(!ended)return;const active=photoTouch.active;clearPhotoTouch();if(active){e.preventDefault();await finishPhotoDrag(true)}},{passive:false});
$('#content').addEventListener('touchcancel',()=>{if(!photoTouch)return;const active=photoTouch.active;clearPhotoTouch();if(active)finishPhotoDrag(false)},{passive:true});

let groupTouch=null;
function clearGroupTouch(){if(groupTouch?.timer)clearTimeout(groupTouch.timer);groupTouch=null}
$('#content').addEventListener('touchstart',e=>{
  if(e.touches.length!==1||ui.search||ui.selected||ui.tab!=='groups'||ui.group)return;
  if(e.target.closest('[data-group-menu]'))return;
  const card=e.target.closest('.group-card[data-group-id]');if(!card)return;
  const t=e.touches[0];groupTouch={id:t.identifier,source:card,startX:t.clientX,startY:t.clientY,active:false,timer:setTimeout(()=>{if(!groupTouch)return;const h=groupTouch;h.active=beginGroupDrag(h.source,h.startX,h.startY,null)},300)}
},{passive:true});
$('#content').addEventListener('touchmove',e=>{
  if(!groupTouch)return;const t=touchById(e.touches,groupTouch.id);if(!t)return;
  if(!groupTouch.active){if(Math.abs(t.clientX-groupTouch.startX)+Math.abs(t.clientY-groupTouch.startY)>11)clearGroupTouch();return}
  e.preventDefault();updateGroupDrag(t.clientX,t.clientY)
},{passive:false});
$('#content').addEventListener('touchend',async e=>{
  if(!groupTouch)return;const ended=touchById(e.changedTouches,groupTouch.id);if(!ended)return;
  const active=groupTouch.active;clearGroupTouch();if(active){e.preventDefault();await finishGroupDrag(true)}
},{passive:false});
$('#content').addEventListener('touchcancel',()=>{if(!groupTouch)return;const active=groupTouch.active;clearGroupTouch();if(active)finishGroupDrag(false)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){ui.unlocked=false;ui.viewerId=null;$('#viewer')?.remove()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.viewerId)closeViewer();else if($('#popups').children.length)closePopup()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
function bootError(stage,e){
  console.error('起動エラー',stage,e);
  const name=esc(e?.name||'Error'),msg=esc(e?.message||String(e||'不明なエラー'));
  $('#content').innerHTML=`<div class="empty"><h2>アプリを開けませんでした</h2><p>保存データは削除していません。</p><p class="muted">段階：${esc(stage)} / ${name}<br>${msg}<br>${APP_BUILD}</p><button class="primary" data-action="retry-app">もう一度開く</button></div>`
}
async function startApp(){
  try{db?.close?.()}catch(_){}
  try{db=await openDbRetry()}catch(e){bootError('保存領域を開く',e);return}
  try{let old=await txGet('settings','state');if(old)state=old}catch(e){bootError('保存状態を読む',e);return}
  try{render();scrollToLatest();setTimeout(()=>backfillVideoThumbs().catch(console.warn),250)}catch(e){bootError('画面を表示する',e);return}
}
startApp();
</script></body></html>
