gap:2px;padding:2px 2px 20px}.tile{aspect-ratio:1/1;position:relative;background:#e4e8e6;overflow:hidden;user-select:none;-webkit-user-select:none}.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.tile .vid{position:absolute;right:5px;bottom:5px;background:#0008;border-radius:4px;color:white;padding:2px 5px;font-size:10px}.tile.selected:after{content:"✓";position:absolute;inset:0;background:#1c7a614f;color:white;font-size:26px;display:grid;place-items:center;font-weight:700}.tile.move-from{outline:3px solid var(--accent);outline-offset:-3px}.tile.drop-target{outline:4px solid #ffd46a;outline-offset:-4px}.tile .hidden-icon{position:absolute;inset:0;display:grid;place-items:center;color:#6c746f;font-size:24px}.tile.drag-ready{touch-action:none}.gallery.select-mode .tile{touch-action:pan-y;-webkit-touch-callout:none}.status{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.status button,.textbtn{color:var(--accent);background:none;border:0;font-weight:700;font-size:12px}.empty{min-height:58%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;padding:40px 25px;text-align:center}.empty .big{font-size:46px;line-height:1}.empty h2{font-size:18px;margin:0}.empty p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.primary{background:var(--accent);color:white;border:0;border-radius:12px;padding:12px 19px;font-weight:700}.secondary{background:var(--light);color:var(--accent);border:0;border-radius:12px;padding:11px 15px;font-weight:700}.group-list{display:flex;flex-direction:column;gap:9px;padding:13px}.group-card{display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:77px}.group-cover{width:55px;height:55px;border-radius:9px;background:#dde8e1;overflow:hidden;display:grid;place-items:center;color:var(--accent);flex:none;font-size:22px}.group-cover img{width:100%;height:100%;object-fit:cover}.group-txt{flex:1;min-width:0}.group-txt strong{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group-txt small{color:var(--muted);font-size:12px}.group-handle{background:none;border:0;padding:13px 4px;color:#a4aaa5;font-size:23px;touch-action:none}.group-add{border:1px dashed #b4c9bf;color:var(--accent);background:var(--light);border-radius:12px;font-size:14px;padding:13px;font-weight:700}.toolbar{flex:none;display:flex;align-items:center;gap:6px;overflow-x:auto;background:#fff;padding:10px 8px;border-top:1px solid var(--line)}.toolbar button{border:0;border-radius:9px;background:var(--light);color:var(--accent);font-size:12px;font-weight:750;padding:10px 10px;white-space:nowrap}.toolbar .del{background:#ffeded;color:var(--danger)}.toolbar span{font-size:12px;color:var(--muted);white-space:nowrap}.overlay{position:fixed;inset:0;z-index:25;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:19px 18px calc(20px + env(safe-area-inset-bottom));max-height:83dvh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:18px}.sheet p{font-size:13px;line-height:1.5;color:var(--muted)}.sheet-row{width:100%;display:flex;align-items:center;gap:10px;padding:14px 3px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:15px;color:var(--ink)}.sheet-row strong{margin-left:auto;color:var(--accent);font-size:13px}.sheet .actions{display:flex;gap:8px;margin-top:16px}.sheet .actions button{flex:1}.sheet input{width:100%;padding:12px;border-radius:9px;border:1px solid #d4d9d5;margin-bottom:10px;font-size:16px}.sheet label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.menu-dismiss{position:fixed;inset:0;z-index:21;border:0;background:transparent;cursor:default}.menu{position:fixed;z-index:22;right:8px;top:calc(51px + env(safe-area-inset-top));background:whi 60caa;padding:20px}.import-card{background:white;border-radius:18px;width:100%;max-width:440px;padding:22px;color:var(--ink);box-shadow:0 14px 55px #0005}.import-card h2{font-size:19px;margin:0 0 12px}.import-card p{font-size:14px;margin:10px 0}.import-card progress{display:block;width:100%;height:16px;accent-color:var(--accent);margin:15px 0}.import-card small{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:14px}.import-card button{width:100%}.notice{position:fixed;z-index:50;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#223a31;color:white;border-radius:12px;padding:10px 15px;font-size:12px;box-shadow:0 5px 20px #0002;max-width:85%;text-align:center}.muted{color:var(--muted);font-size:12px}.lockscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 25px;gap:13px;text-align:center}.lockscreen .big{font-size:42px}.lockscreen h2{font-size:19px;margin:0}.lockscreen p{font-size:12px;line-height:1.6;color:var(--muted);max-width:280px}.lockscreen input{font-size:18px;width:180px;letter-spacing:3px;text-align:center;padding:11px;border:1px solid #d2d8d2;border-radius:12px}.search-panel{padding:12px}.search-panel input{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:13px;font-size:16px}.search-result-title{font-size:13px;color:var(--muted);font-weight:700;margin:20px 2px 7px}.drag-ghost{position:fixed;z-index:99;pointer-events:none;width:74px;height:74px;opacity:.85;border:2px solid var(--accent);border-radius:6px;background:#dce5df;box-shadow:0 6px 24px #0003;overflow:hidden}.drag-ghost img{width:100%;height:100%;object-fit:cover}.warn{padding:12px;background:#fff6e6;border-radius:10px;color:#875a15;font-size:12px;line-height:1.6}.group-actions{display:flex;justify-content:flex-end;gap:12px;padding:4px 14px 10px}.group-actions button{background:none;border:0;color:var(--accent);font-weight:650;font-size:12px}@media(mi </style></head><body>
<div id="app"><header id="header" class="header"></header><main id="content" class="content"></main><div id="toolArea"></div><nav class="bottom" id="bottom"></nav></div><div id="popups"></div><div id="importProgress"></div><input type="file" accept="image/*,video/*" multiple id="importFiles" hidden><input type="file" accept="application/json" id="restoreFile" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uuid=()=>globalThis.crypto?.randomUUID?.()||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const icons={undo:'<path d="M9 4 4 9l5 5M4 9h9c4 0 7 3 7 7s-3 5-7 5"/>',redo:'<path d="m15 4 5 5-5 5m5-5h-9c-4 0-7 3-7 7s3 5 7 5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',sort:'<path d="M4 7h16M7 12h10M10 17h4"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',all:'<rect x="3" y="3" width="15" height="15" rx="2"/><path d="M7 21h13a1 1 0 0 0 1-1V7"/>',group:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',back:'<path d="m15 5-7 7 7 7"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
function svg(k){return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]||''}</svg>`}
const blank=()=>({version:1,photos:{},allOrder:[],hiddenOrder:[],groups:{},groupOrder:[],sort:{all:'manual',hidden:'manual',groups:{}},pinSalt:null,pinHash:null});
let importing=false,importStopRequested=false;
let state=blank(),db,history=[],future=[],urls=new Map(),ui={tab:'all',group:null,page:null,selected:false,ids:new Set(),menu:null,arrange:false,moveId:null,unlocked:false,search:false,query:'',viewerId:null,viewerList:[],dialog:null};
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('NagisaPhotoSortV1',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('assets',{keyPath:'id'});d.createObjectStore('settings')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txGet(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txPut(store,value,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(value,...(key===undefined?[]:[key]));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function txDelete(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function persist(){try{await txPut('settings',state,'state')}catch(e){console.error(e);toast('保存に失敗しました。空き容量を確認してね')}}
function snapshot(){return JSON.stringify(state)}
async function change(fn){history.push(snapshot());if(history.length>45)history.shift();future=[];fn();await persist();render()}
async function undo(){if(!history.length)return;future.push(snapshot());state=JSON.parse(history.pop());await persist();render();toast('一つ戻しました')}
async function redo(){if(!future.length)return;history.push(snapshot());state=JSON.parse(future.pop());await persist();render();toast('一つ進みました')}
function toast(txt){$('.notice')?.remove();const el=document.createElement('div');el.className='notice';el.textContent=txt;document.body.append(el);setTimeout(()=>el.remove(),2400)}
function photo(id){return state.photos[id]}
function available(p){return p&&!p.deletedAt}
function groupCount(g){return g.order.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).groupIds.includes(g.id)).length}
function visibleIds(){if(ui.page==='trash'||ui.tab==='trash')return [];let ids=[];if(ui.tab==='all')ids=state.allOrder.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).showAll);else if(ui.tab==='hidden')ids=ui.unlocked?state.hiddenOrder.filter(id=>available(photo(id))&&photo(id).hidden):[];else if(ui.group&&state.groups[ui.group])ids=state.groups[ui.group].order.filter(id=>available(photo(id))&&!photo(id).hidden&&photo(id).groupIds.includes(ui.group));const mode=getSort();if(mode==='new')ids.sort((a,b)=>photo(b).importAt-photo(a).importAt);if(mode==='old')ids.sort((a,b)=>photo(a).importAt-photo(b).importAt);if(mode==='filename')ids.sort((a,b)=>photo(a).name.localeCompare(photo(b).name,'ja'));if(mode==='modified')ids.sort((a,b)=>photo(b).modified-photo(a).modified);return ids}
function getSort(){if(ui.tab==='all')return state.sort.all;if(ui.tab==='hidden')return state.sort.hidden;if(ui.group)return state.sort.groups[ui.group]||'manual';return 'manual'}
function orderForView(){if(ui.tab==='all')return state.allOrder;if(ui.tab==='hidden')return state.hiddenOrder;if(ui.tab==='groups'&&ui.group)return state.groups[ui.group].order;return null}
function arrange(arr,id,target){let i=arr.indexOf(id),j=arr.indexOf(target);if(i<0||j<0||i===j)return false;arr.splice(i,1);j=arr.indexOf(target);arr.splice(j,0,id);return true}
function setTab(tab){closePopup();ui.tab=tab;ui.group=null;ui.page=null;ui.selected=false;ui.ids.clear();ui.arrange=false;ui.moveId=null;ui.search=false;ui.menu=null;ui.viewerId=null;if(tab!=='hidden')ui.unlocked=false;render();$('#content').scrollTop=0}
function header(){const inTrash=ui.page==='trash'||ui.tab==='trash';let title=inTrash?'最近削除した項目':ui.search?'検索':ui.tab==='all'?'すべて':ui.tab==='hidden'?'非公開':ui.group&&state.groups[ui.group]?state.groups[ui.group].name:'グループ';let back=!!(ui.group||ui.page||ui.search);$('#header').innerHTML=`${back?`<button class="iconbtn" data-action="back" aria-label="戻る">${svg('back')}</button>`:''}<h1>${esc(title)}</h1><div class="h-actions"><button class="iconbtn" data-action="undo" ${!history.length?'disabled':''} aria-label="一つ戻る">${svg('undo')}</button><button class="iconbtn" data-action="redo" ${!future.length?'disabled':''} aria-label="一つ進む">${svg('redo')}</button>${!inTrash?`<button class="iconbtn" data-action="search" aria-label="検索">${svg('search')}</button><button class="iconbtn" data-action="sort" aria-label="ソート">${svg('sort')}</button>`:''}${!inTrash&&!ui.page&&!ui.search&&!(ui.tab==='hidden'&&!ui.unlocked)&&!(ui.tab==='groups'&&!ui.group)?`<button class="selectbtn" data-action="select">${ui.selected?'完了':'一括選択'}</button>`:''}<button class="iconbtn" data-action="more" aria-label="その他メニュー">${svg('dots')}</button></div>`}
function bottom(){let tabs=[['all','すべて','all'],['groups','グループ','group'],['hidden','非公開','lock'],['trash','ゴミ箱','trash']];$('#bottom').innerHTML=tabs.map(([t,label,ico])=>`<button class="tab ${ui.tab===t?'active':''}" data-tab="${t}" aria-label="${label}">${svg(ico)}<span>${label}</span></button>`).join('')}
function thumb(id,opts={}){const p=photo(id);if(!p)return '';let sel=ui.ids.has(id),locked=opts.locked;return `<div class="tile ${sel?'selected':''} ${ui.moveId===id?'move-from':''} ${ui.arrange?'drag-ready':''}" data-photo-id="${id}">${locked?'<span class="hidden-icon">🔒</span>':`<img loading="lazy" data-img-id="${id}" alt="${esc(p.name)}">${p.type.startsWith('video/')?'<span class="vid">▶ 動画</span>':''}`}</div>`}
async function assetUrl(id,thumbnail=true){let key=id+(thumbnail?'t':'f');if(urls.has(key))return urls.get(key);let obj=await txGet('assets',id);if(!obj)return null;let blob=thumbnail?(obj.thumb||obj.blob):obj.blob;let url=URL.createObjectURL(blob);urls.set(key,url);return url}
let thumbObserver=null;
function loadThumbs(root=document){
  thumbObserver?.disconnect();
  const imgs=[...root.querySelectorAll('img[data-img-id]')];
  const load=async img=>{const id=img.dataset.imgId,url=await assetUrl(id);if(img.isConnected&&url)img.src=url};
  if('IntersectionObserver' in window){
    thumbObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){thumbObserver?.unobserve(entry.target);load(entry.target)}})},{root:$('#content'),rootMargin:'250px 0px'});
    imgs.forEach(img=>thumbObserver.observe(img));
  }else imgs.forEach(load);
}
function closePopup(){ui.menu=null;$('#popups').innerHTML=''}

async function makeThumb(file){if(file.type.startsWith('video/'))return null;let url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();let scale=Math.min(1,384/Math.max(im.naturalWidth,im.naturalHeight));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let thumb=await new Promise(res=>c.toBlob(res,'image/jpeg',.78));return thumb||file}catch(e){return file}finally{URL.revokeObjectURL(url)}}

// Afterwards, commit small batches atomically so an interrupted import keeps completed batches.
const importKey=p=>[p.name,p.size,p.modified].join('\u0000');
function renderImportProgress(done,total,saved,skipped,failed,name=''){
  const node=$('#importProgress');
  if(!node.firstElementChild){node.innerHTML=`<div class="import-overlay" role="dialog" aria-modal="true" aria-label="写真の取り込み"><div class="import-card"><h2>写真を取り込み中</h2><p id="importStatus" aria-live="polite"></p><progress id="importBar" max="${total}" value="0"></progress><small id="importDetails"></small><button class="secondary" data-cancel-import>途中で中止する</button></div></div>`}
  $('#importBar').max=total;
  $('#importBar').value=Math.min(total,done);
  $('#importStatus').textContent=`${done} / ${total} 件を処理 ・ ${saved} 件保存済み`;
  $('#importDetails').textContent=`${skipped?skipped+'件の重複をスキップ ・ ':''}${failed?failed+'件でエラー ・ ':''}保存は10件ごとに確定します。画面を閉じずにお待ちください。${name?' 現在：'+name:''}`;
  const btn=$('[data-cancel-import]');if(btn){btn.disabled=importStopRequested;btn.textContent=importStopRequested?'中止処理中…':'途中で中止する'}
}
async function saveImportBatch(batch,firstBatch,insertAt){
  if(!batch.length)return;
  const next={...state,photos:{...state.photos},allOrder:[...state.allOrder.slice(0,insertAt),...batch.map(x=>x.p.id),...state.allOrder.slice(insertAt)],sort:{...state.sort,all:'manual'}};
  batch.forEach(({p})=>next.photos[p.id]=p);
  const before=firstBatch?snapshot():null;
  await new Promise((resolve,reject)=>{
    let transaction;
    try{
      transaction=db.transaction(['assets','settings'],'readwrite');
      const assets=transaction.objectStore('assets');
      for(const {p,file,thumb} of batch)assets.put({id:p.id,blob:file,thumb:thumb===file?null:thumb});
      transaction.objectStore('settings').put(next,'state');
    }catch(e){if(transaction)try{transaction.abort()}catch(_){}reject(e);return}
    transaction.oncomplete=()=>resolve();
    transaction.onerror=()=>reject(transaction.error||new Error('保存処理エラー'));
    transaction.onabort=()=>reject(transaction.error||new Error('保存が中断されました'));
  });
  if(firstBatch){history.push(before);if(history.length>45)history.shift();future=[]}
  state=next;
}
async function importFiles(files){
  if(importing)return toast('前の写真を取り込み中です');
  files=Array.from(files).filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
  if(!files.length)return toast('写真や動画を選択してね');
  importing=true;importStopRequested=false;
  const total=files.length;
  let done=0,saved=0,skipped=0,failed=0,reason='',batch=[],madeFirstCommit=false;
  const known=new Set(Object.values(state.photos).filter(available).map(importKey));
  const importBase=Object.values(state.photos).reduce((m,p)=>Math.max(m,p.importAt||0),Date.now())+1;
  renderImportProgress(0,total,0,0,0);
  try{
    // A successful request is not guaranteed, but persistent storage reduces eviction risk on supported Home Screen apps.
    try{await navigator.storage?.persist?.()}catch(_){}
    for(const file of files){
      if(importStopRequested)break;
      const name=file.name||'写真',modified=file.lastModified||0;
      const key=importKey({name,size:file.size,modified});
      done++;
      if(known.has(key)){skipped++;renderImportProgress(done,total,saved,skipped,failed);continue}
      known.add(key);
      try{
        const thumb=await makeThumb(file),id=uuid();
        const p={id,name,type:file.type||'image/jpeg',size:file.size,modified,importAt:importBase+total-done,groupIds:[],showAll:true,hidden:false,deletedAt:null};
        batch.push({p,file,thumb});
      }catch(e){failed++;console.error('写真を準備できませんでした',e)}
      if(batch.length>=10){
        try{await saveImportBatch(batch,!madeFirstCommit,saved);madeFirstCommit=true;saved+=batch.length;batch=[]}
        catch(e){console.error('写真の保存ができませんでした',e);reason=e?.name==='QuotaExceededError'?'端末のWebアプリ用保存容量が足りません。':'写真の保存中にエラーが発生しました。';break}
        // Allow the UI to paint, and avoid a huge single main-thread task on an iPhone.
        await new Promise(resolve=>setTimeout(resolve,0));
      }
      renderImportProgress(done,total,saved,skipped,failed,name);
    }
    if(batch.length){
      try{await saveImportBatch(batch,!madeFirstCommit,saved);madeFirstCommit=true;saved+=batch.length;batch=[]}
      catch(e){console.error('最後の写真を保存できませんでした',e);reason=e?.name==='QuotaExceededError'?'端末のWebアプリ用保存容量が足りません。':'写真の保存中にエラーが発生しました。'}
    }
  }catch(e){console.error('写真の取り込みが中断されました',e);reason='取り込み中にエラーが発生しました。'}
  finally{
    $('#importProgress').innerHTML='';importing=false;
    const cancelled=importStopRequested;importStopRequested=false;
    if(saved){setTab('all')}else render();
    if(reason||cancelled||failed){
      modal('写真の取り込み結果',`<p>${total}件中、<strong>${saved}件を保存</strong>しました。${skipped?` 重複${skipped}件はスキップ。`:''}${failed?` 処理失敗${failed}件。`:''}</p><p>${esc(reason|| (cancelled?'途中で中止しました。':'一部の写真を処理できませんでした。'))}保存済みの写真はそのまま残っています。</p><p>残りは少量ずつ再度選択できます。元のiPhone写真は消していません。</p><div class="actions"><button class="primary" data-action="close-modal">確認</button></div>`);
    }else toast(`${saved}件を追加しました${skipped?'（重複'+skipped+'件はスキップ）':''}`);
  }
}

// iPhone Photos-style continuous selection: hold and trace across rows/columns.
let selectSweep=null;
function syncSelectionSweep(){
  const chosen=ui.ids;$$('#gallery .tile').forEach(tile=>tile.classList.toggle('selected',chosen.has(tile.dataset.photoId)));
  const bar=$('#toolArea .toolbar');if(bar){const count=[...chosen].filter(id=>selectSweep?.order.includes(id)??visibleIds().includes(id)).length;
    const label=bar.querySelector('span');if(label)label.textContent=`${count}枚選択`;
    bar.querySelectorAll('button').forEach(btn=>{if(btn.dataset.action==='select-all'){btn.disabled=false;btn.textContent=count===selectSweep?.order.length?'選択解除':'すべて選択'}else btn.disabled=count===0});
  }
}
function sweepIndexAt(x,y){
  const gallery=$('#gallery'),content=$('#content');if(!gallery||!content)return -1;
  const g=gallery.getBoundingClientRect(),c=content.getBoundingClientRect();
  const left=Math.max(g.left+2,c.left+2),right=Math.min(g.right-2,c.right-2);
  const top=Math.max(g.top+2,c.top+2),bottom=Math.min(g.bottom-2,c.bottom-2);
  if(right<=left||bottom<=top)return -1;
  const tile=document.elementFromPoint(Math.min(right,Math.max(left,x)),Math.min(bottom,Math.max(top,y)))?.closest('#gallery [data-photo-id]');
  return tile?selectSweep.order.indexOf(tile.dataset.photoId):-1;
}
function applySweepAt(x,y){
  const gesture=selectSweep;if(!gesture)return;
  const ix=sweepIndexAt(x,y);if(ix<0)return;
  gesture.lastIndex=ix;
  ui.ids=new Set(gesture.before);
  for(let i=Math.min(gesture.anchor,ix);i<=Math.max(gesture.anchor,ix);i++){
    const id=gesture.order[i];if(gesture.add)ui.ids.add(id);else ui.ids.delete(id);
  }
  syncSelectionSweep();
}
function autoScrollSweep(){
  const g=selectSweep;if(!g||!g.active)return;
  const content=$('#content'),rect=content.getBoundingClientRect(),margin=65;
  let velocity=0;
  if(g.y<rect.top+margin)velocity=-Math.ceil((rect.top+margin-g.y)/5);
  else if(g.y>rect.bottom-margin)velocity=Math.ceil((g.y-(rect.bottom-margin))/5);
  if(velocity){const before=content.scrollTop;content.scrollTop+=Math.max(-20,Math.min(20,velocity));if(before!==content.scrollTop)applySweepAt(g.x,g.y)}

function stopSweep(cancel=false){
  const g=selectSweep;if(!g)return false;
  selectSweep=null;if(g.frame)cancelAnimationFrame(g.frame);
  if(cancel){ui.ids=new Set(g.before);syncSelectionSweep();return false}

  ui.ignoreSweepClick=true;
